name: Build IPK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx ares-package app -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: stremio-wrapper-ipk
          path: dist/*.ipk
